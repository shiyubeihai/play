<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F1F9">
<title>眼动放松 · ∞</title>
<style>
:root{
  --page-bg:#08150E;
  --ink:#E4F0E9;
  --dim:#7E9C8C;
  --mark:#8FE3B8;
  --sub:#5E7C6B;
  --desc:#9DB5A7;
  --desc-hi:#D8EADF;
  --kbd:#CFE7DA;
  --seg-bg:rgba(255,255,255,.03);
  --seg-line:rgba(140,210,175,.16);
  --chip:#7E9C8C;
  --seg-on-bg:rgba(120,220,165,.14);
  --chip-on:#D3EFDF;
  --cta-fg:#06170F;
  --cta-a:#A8EDC6;
  --cta-b:#63C896;
  --cta-shadow:rgba(90,200,150,.24);
  --tiny:#4E6A5B;
  --panel-a:rgba(9,24,17,.90);
  --panel-b:rgba(3,8,6,.70);
  --rest-a:rgba(8,20,14,.88);
  --rest-b:rgba(4,10,7,.70);
  --rest-dot:#BFEBD3;
  --rest-glow:rgba(140,230,190,.45);
  --rest-sub:#6F8C7C;
  --rest-num:#4C6558;
  --stat:#DCF0E5;
  --stat-k:#5E7C6B;
  --best-k:#52705F;
  --best-v:#8FBFA4;
  --bar-bg:rgba(255,255,255,.05);
  --bar-a:#2f7a58;
  --bar-b:#7fe0ad;
  --hint:rgba(205,232,216,.6);
}
body[data-theme="cloud"]{
  --page-bg:#E6F1F9;
  --ink:#17384F;
  --dim:#7391A5;
  --mark:#4E9CC8;
  --sub:#6E8CA0;
  --desc:#4A6A80;
  --desc-hi:#132F44;
  --kbd:#2A5673;
  --seg-bg:rgba(255,255,255,.55);
  --seg-line:rgba(60,120,165,.18);
  --chip:#6E8CA0;
  --seg-on-bg:rgba(255,255,255,.95);
  --chip-on:#1B4360;
  --cta-fg:#FFFFFF;
  --cta-a:#2E7FB4;
  --cta-b:#17567F;
  --cta-shadow:rgba(60,130,175,.28);
  --tiny:#7E9AAE;
  --panel-a:rgba(248,252,255,.92);
  --panel-b:rgba(226,239,249,.62);
  --rest-a:rgba(240,248,253,.90);
  --rest-b:rgba(220,235,246,.72);
  --rest-dot:#2F6E96;
  --rest-glow:rgba(90,160,200,.30);
  --rest-sub:#6E8CA0;
  --rest-num:#93AEC0;
  --stat:#17384F;
  --stat-k:#6E8CA0;
  --best-k:#7E9AAE;
  --best-v:#2E7FB4;
  --bar-bg:rgba(30,60,90,.10);
  --bar-a:#7FB6D8;
  --bar-b:#2E7FB4;
  --hint:rgba(40,80,110,.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--page-bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:color .45s ease;
}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 22px) 0 calc(env(safe-area-inset-left, 0px) + 22px);
  pointer-events:none;
  font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .5s ease;
}
body.playing #hud{opacity:1}
.hud-cell{display:flex;flex-direction:column;gap:5px}
.hud-cell.mid{align-items:center}
.hud-cell.end{align-items:flex-end}
.hud-k{font-size:10px;letter-spacing:.24em;color:var(--dim);text-indent:.24em}
.hud-v{font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1}

#bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--bar-bg);opacity:0;transition:opacity .5s;pointer-events:none}
body.playing #bar{opacity:1}
#bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--bar-a),var(--bar-b))}

#hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh);transform:translateX(-50%);
  font-size:13px;letter-spacing:.16em;color:var(--hint);
  opacity:0;transition:opacity .9s ease;pointer-events:none;white-space:nowrap;
}
#hint.on{opacity:1}

/* ---------- 远眺休息 ---------- */
.rest{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(circle at 50% 46%, var(--rest-a) 0%, var(--rest-b) 62%);
  opacity:0;visibility:hidden;transition:opacity .7s ease, visibility .7s, background .45s;
  pointer-events:none;
}
.rest.show{opacity:1;visibility:visible;pointer-events:auto}
.rest .dot{
  width:9px;height:9px;border-radius:50%;background:var(--rest-dot);
  box-shadow:0 0 22px 6px var(--rest-glow);
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(.8);opacity:.5}
  50%{transform:scale(1.15);opacity:1}
}
.rest-t{font-size:19px;letter-spacing:.3em;text-indent:.3em;margin-top:22px}
.rest-s{font-size:12px;letter-spacing:.18em;text-indent:.18em;color:var(--rest-sub);margin-top:8px}
.rest-n{font-size:13px;letter-spacing:.22em;color:var(--rest-num);margin-top:14px;font-variant-numeric:tabular-nums}

/* ---------- 面板 ---------- */
.panel{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:32px 28px;
  overflow-y:auto;
  background:radial-gradient(circle at 50% 44%, var(--panel-a), var(--panel-b));
  opacity:0;visibility:hidden;transition:opacity .5s ease, visibility .5s, background .45s;
}
.panel.show{opacity:1;visibility:visible}

.mark{font-size:50px;line-height:1;color:var(--mark);opacity:.85;margin-bottom:18px;font-weight:300}
h1{font-size:28px;font-weight:600;letter-spacing:.22em;text-indent:.22em}
.desc{font-size:13.5px;line-height:2.05;color:var(--desc);margin-top:26px;letter-spacing:.04em}
.desc b{color:var(--desc-hi);font-weight:500}
kbd{
  display:inline-block;padding:1px 8px;margin:0 2px;
  border:1px solid var(--seg-line);border-radius:5px;
  font-size:12px;color:var(--kbd);font-family:inherit;
}

.row{display:flex;align-items:center;gap:12px;margin-top:15px}
.row-k{font-size:11px;letter-spacing:.18em;color:var(--dim);width:34px;text-align:right;text-indent:.18em}
.seg{
  display:flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--seg-bg);border:1px solid var(--seg-line);
  transition:background .3s, border-color .3s;
}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--chip);
  font:inherit;font-size:12.5px;letter-spacing:.12em;text-indent:.12em;
  padding:7px 15px;border-radius:999px;cursor:pointer;
  transition:background .2s, color .2s;
}
.seg button:hover{color:var(--chip-on)}
.seg button.on{background:var(--seg-on-bg);color:var(--chip-on)}

.cta{
  appearance:none;border:0;margin-top:28px;cursor:pointer;
  font:inherit;font-size:14.5px;letter-spacing:.22em;text-indent:.22em;
  color:var(--cta-fg);font-weight:600;
  padding:14px 46px;border-radius:999px;
  background:linear-gradient(180deg,var(--cta-a),var(--cta-b));
  box-shadow:0 6px 26px var(--cta-shadow);
  transition:transform .18s ease, box-shadow .18s ease, background .45s;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 10px 34px var(--cta-shadow)}
.cta:active{transform:translateY(0) scale(.985)}

.tiny{font-size:11.5px;color:var(--tiny);letter-spacing:.1em;margin-top:18px}

.keys{
  font-size:11.5px;line-height:2.05;letter-spacing:.06em;
  color:var(--desc);margin-top:10px;
  max-width:320px;
}
.keys kbd{
  margin:0 2px;padding:0 6px;font-size:11px;
  color:var(--kbd);
  border-color:var(--seg-line);
}
.keys .sep{opacity:.4;margin:0 4px}
@media (pointer:coarse){
  .keys{display:none}
}

/* ---------- 结算 ---------- */
h2{font-size:21px;font-weight:600;letter-spacing:.22em;text-indent:.22em}
.stats{display:flex;gap:44px;margin:38px 0 6px}
.stats div{display:flex;flex-direction:column;gap:10px;align-items:center}
.stats span{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--stat);line-height:1}
.stats em{font-style:normal;font-size:11px;letter-spacing:.2em;text-indent:.2em;color:var(--stat-k)}
.best{font-size:12px;letter-spacing:.16em;color:var(--best-k);margin-top:24px}
.best b{color:var(--best-v);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 按钮组 / 次级按钮 ---------- */
.actions{
  display:flex;gap:12px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-top:30px;
}
.actions .cta{margin-top:0}
.ghost{
  appearance:none;cursor:pointer;
  font:inherit;font-size:13px;letter-spacing:.16em;text-indent:.16em;
  color:var(--chip);
  padding:13px 28px;border-radius:999px;
  background:transparent;
  border:1px solid var(--seg-line);
  transition:color .2s, border-color .2s, background .2s;
}
.ghost:hover{color:var(--chip-on);border-color:var(--dim);background:var(--seg-bg)}

.pause-sub{font-size:12.5px;letter-spacing:.14em;color:var(--dim);margin-top:16px}

/* ---------- 局中控制 ---------- */
.ctl{
  position:fixed;right:calc(env(safe-area-inset-right, 0px) + 18px);bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);z-index:6;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--seg-line);
  background:var(--seg-bg);
  color:var(--dim);
  cursor:pointer;padding:0;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease, color .2s, border-color .2s, background .3s;
  -webkit-tap-highlight-color:transparent;
}
.ctl i{
  display:block;width:3px;height:12px;border-radius:1px;
  background:currentColor;
}
body.playing .ctl{opacity:.5;pointer-events:auto}
body.playing .ctl:hover{opacity:1;color:var(--chip-on);border-color:var(--dim)}

@media (max-width:520px){
  h1{font-size:23px}
  .desc{font-size:12.5px;line-height:1.95;margin-top:20px}
  .row{gap:8px;margin-top:12px}
  .seg button{padding:6px 12px;font-size:12px}
  .stats{gap:26px}
  .stats span{font-size:25px}
  .cta{padding:13px 34px;font-size:13.5px;margin-top:22px}
  .actions{margin-top:22px}
  .actions .cta{margin-top:0}
  .ghost{padding:12px 22px;font-size:12.5px}
  .hud-v{font-size:19px}
  .mark{font-size:42px;margin-bottom:14px}
  .ctl{right:calc(env(safe-area-inset-right, 0px) + 14px);bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);width:42px;height:42px}
  .seg button{padding:9px 13px}
  .row-k{width:32px}
}
@media (max-height:620px){
  .mark{display:none}
  .desc{margin-top:14px;line-height:1.8}
  .cta{margin-top:18px}
  .tiny{margin-top:12px}
}
</style>
</head>
<body data-theme="cloud">

<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-cell">
    <span class="hud-k">得分</span>
    <span class="hud-v" id="hScore">0</span>
  </div>
  <div class="hud-cell mid">
    <span class="hud-k">连击</span>
    <span class="hud-v" id="hCombo">—</span>
  </div>
  <div class="hud-cell end">
    <span class="hud-k">剩余</span>
    <span class="hud-v" id="hTime">2:45</span>
  </div>
</div>
<div id="bar"><i></i></div>
<div id="hint"></div>
<button id="btnPause" class="ctl" aria-label="暂停"><i></i><i></i></button>

<div id="rest" class="rest">
  <div class="dot"></div>
  <div class="rest-t">看向 6 米外</div>
  <div class="rest-s">慢慢眨眼 · 松一松肩颈</div>
  <div class="rest-n" id="restN">15</div>
</div>

<div id="start" class="panel show">
  <div class="mark">∞</div>
  <h1>眼动放松</h1>
  <p class="desc">
    眼睛跟着红果走，<b>头部不动</b>。<br>
    红果穿过光门时，<b>点屏幕</b>（电脑可按 <kbd>空格</kbd>）。<br>
    红果会一近一远地变焦，跟着它一起调焦。
  </p>

  <div class="row">
    <span class="row-k">节奏</span>
    <div class="seg" id="pace">
      <button data-pace="12" class="on">放松</button>
      <button data-pace="8.5">舒展</button>
      <button data-pace="6">训练</button>
    </div>
  </div>

  <div class="row">
    <span class="row-k">背景</span>
    <div class="seg" id="theme">
      <button data-theme-id="cloud" class="on">云朵</button>
      <button data-theme-id="ocean">海洋</button>
      <button data-theme-id="forest">森林</button>
    </div>
  </div>

  <div class="row">
    <span class="row-k">走位</span>
    <div class="seg" id="shape">
      <button data-shape="v8" class="on">竖 8</button>
      <button data-shape="vellipse">竖椭圆</button>
      <button data-shape="h8">横 8</button>
    </div>
  </div>

  <button id="btnStart" class="cta">开始</button>
  <p class="tiny">3 轮 × 45 秒，每轮之间 15 秒远眺</p>
  <p class="keys">
    <kbd>空格</kbd> 开始 / 凝视 <span class="sep">·</span>
    <kbd>Esc</kbd> 暂停 <span class="sep">·</span>
    <kbd>P</kbd> 暂停 / 继续
  </p>
</div>

<div id="result" class="panel">
  <h2>这轮结束了</h2>
  <div class="stats">
    <div><span id="rHits">0</span><em>凝视</em></div>
    <div><span id="rCombo">0</span><em>最高连击</em></div>
    <div><span id="rScore">0</span><em>得分</em></div>
  </div>
  <p class="best">最佳成绩 <b id="rBest">0</b></p>
  <div class="actions">
    <button id="btnAgain" class="cta">再来一轮</button>
    <button id="btnHome" class="ghost">返回首页</button>
  </div>
</div>

<div id="pause" class="panel">
  <h2>已暂停</h2>
  <p class="pause-sub">眼睛歇一会儿 · 按 <kbd>Esc</kbd> 继续</p>
  <div class="actions">
    <button id="btnResume" class="cta">继续</button>
    <button id="btnQuit" class="ghost">返回首页</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= 元素 ================= */
var cv   = document.getElementById('cv');
var ctx  = cv.getContext('2d');
var bgc  = document.createElement('canvas');
var bgx  = bgc.getContext('2d');

var elScore = document.getElementById('hScore');
var elCombo = document.getElementById('hCombo');
var elTime  = document.getElementById('hTime');
var barFill = document.querySelector('#bar i');
var hintEl  = document.getElementById('hint');

var startEl  = document.getElementById('start');
var resultEl = document.getElementById('result');
var restEl   = document.getElementById('rest');
var restN    = document.getElementById('restN');
var pauseEl  = document.getElementById('pause');

var rHits  = document.getElementById('rHits');
var rCombo = document.getElementById('rCombo');
var rScore = document.getElementById('rScore');
var rBest  = document.getElementById('rBest');

/* ================= 常量 ================= */
var N = 1200;
var ROUNDS = 3, PLAY = 45, REST = 15;
var NEAR_S = 0.72;                 // 光门激活窗口（秒）
var STORE_BEST  = 'eyefit.forest.best.v1';
var STORE_THEME = 'eyefit.theme.v1';
var STORE_PACE  = 'eyefit.pace.v1';
var STORE_SHAPE = 'eyefit.shape.mobile.v1';

/* ================= 尺寸 ================= */
var W = 1, H = 1, DPR = 1;
var A = 500, B = 180, CX = 500, CY = 350, R = 10;

/* ================= 路径 ================= */
var curve = [];
var cum = new Float64Array(N + 1);
var TOTAL = 1;
var gates = [];

/* ================= 状态 ================= */
var state = {
  mode: 'idle',
  t: 0,
  pace: 12,
  shape: 'v8',
  dist: 0,
  speed: 200,
  depth: 0,          // 0 近 / 1 远（缓动值）
  depthTo: 0,        // 目标
  depthLabel: 0,     // 近/远标签剩余秒数
  round: 0,
  roundTime: 0,
  restLeft: 0,
  remain: ROUNDS * PLAY + (ROUNDS - 1) * REST,
  score: 0, combo: 0, bestCombo: 0, hits: 0,
  ball: { x: 0, y: 0 },
  hint: 0,
  lastPress: -99,
  pauseFrom: 'playing'
};

var trail = [];
var blooms = [];
var ripples = [];
var motes = [];

/* ================= 工具 ================= */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function fmt(s){
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= 主题 ================= */
var THEMES = {
  cloud: {
    id: 'cloud',
    blend: 'source-over',
    inkRGB: '30,58,79',
    guideRGB: '120,160,195',
    gateRGB: '40,110,170',
    gateMul: 1.35,
    ballGlowMul: 0.42,
    shadowMul: 0.20,
    rim: 0.55,
    trailMul: 0.55,
    moteRGB: '140,180,210',
    moteBlend: 'source-over',
    moteAlpha: 0.22,
    moteSpeed: -6,
    bloomHot: '#F08519',
    bloom: '#F2A24B',
    bg: bgCloud
  },
  ocean: {
    id: 'ocean',
    blend: 'lighter',
    inkRGB: '150,225,242',
    guideRGB: '90,175,205',
    gateRGB: '110,225,240',
    gateMul: 1.0,
    ballGlowMul: 1,
    shadowMul: 0,
    rim: 0,
    trailMul: 1,
    moteRGB: '160,220,240',
    moteBlend: 'lighter',
    moteAlpha: 0.26,
    moteSpeed: -14,
    bloomHot: '#FFD08A',
    bloom: '#FFB27A',
    bg: bgOcean
  },
  forest: {
    id: 'forest',
    blend: 'lighter',
    inkRGB: '170,245,205',
    guideRGB: '140,235,190',
    gateRGB: '150,240,196',
    gateMul: 1.0,
    ballGlowMul: 1,
    shadowMul: 0,
    rim: 0,
    trailMul: 1,
    moteRGB: '159,220,184',
    moteBlend: 'lighter',
    moteAlpha: 0.28,
    moteSpeed: -9,
    bloomHot: '#FFD08A',
    bloom: '#FFB27A',
    bg: bgForest
  }
};

var THEME = THEMES.cloud;

/* ================= 光晕贴图 ================= */
function makeGlow(size, stops){
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (var i = 0; i < stops.length; i++) grd.addColorStop(stops[i][0], stops[i][1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

var GLOW_BALL = makeGlow(256, [
  [0.00, 'rgba(255,248,232,1)'],
  [0.10, 'rgba(255,196,132,0.92)'],
  [0.26, 'rgba(255,120,84,0.50)'],
  [0.55, 'rgba(232,66,60,0.15)'],
  [1.00, 'rgba(232,66,60,0)']
]);

var GLOW_TRAIL = makeGlow(128, [
  [0.00, 'rgba(255,198,152,0.80)'],
  [0.35, 'rgba(255,110,80,0.28)'],
  [1.00, 'rgba(255,90,70,0)']
]);

var SHADOW_BALL = makeGlow(128, [
  [0.00, 'rgba(150,80,55,0.34)'],
  [0.42, 'rgba(150,90,70,0.14)'],
  [1.00, 'rgba(150,90,70,0)']
]);

var GATE_GLOW = null;

function buildThemeSprites(){
  GATE_GLOW = makeGlow(128, [

/* ================= 背景：云朵 ================= */
function drawCloudBlob(c, x, y, w, h, alpha){
  var lobes = 11;
  var i, f, bulge, lx, ly, lr, gg;

  // 1. 阴影层：同样的团，整体下移，形成贴着轮廓的云底
  for (i = 0; i < lobes; i++){
    f = i / (lobes - 1);
    bulge = Math.sin(f * Math.PI);
    lx = x + (f - 0.5) * w;
    ly = y - bulge * h * 0.36 + Math.sin(f * 7.3) * h * 0.09 + h * 0.20;
    lr = h * (0.30 + bulge * 0.30) * (0.92 + (i % 3) * 0.07);

    gg = c.createRadialGradient(lx, ly, 0, lx, ly, lr);
    gg.addColorStop(0.00, 'rgba(112,150,186,' + (alpha * 0.55) + ')');
    gg.addColorStop(0.58, 'rgba(126,164,196,' + (alpha * 0.40) + ')');
    gg.addColorStop(1.00, 'rgba(140,176,206,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.arc(lx, ly, lr, 0, 6.2832);
    c.fill();
  }

  // 2. 受光面
  for (i = 0; i < lobes; i++){
    f = i / (lobes - 1);
    bulge = Math.sin(f * Math.PI);
    lx = x + (f - 0.5) * w;
    ly = y - bulge * h * 0.36 + Math.sin(f * 7.3) * h * 0.09;
    lr = h * (0.30 + bulge * 0.30) * (0.92 + (i % 3) * 0.07);

    gg = c.createRadialGradient(lx, ly - lr * 0.22, 0, lx, ly, lr);
    gg.addColorStop(0.00, 'rgba(255,255,255,' + Math.min(0.97, alpha * 1.15) + ')');
    gg.addColorStop(0.62, 'rgba(253,255,255,' + (alpha * 0.80) + ')');
    gg.addColorStop(1.00, 'rgba(250,253,255,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.arc(lx, ly, lr, 0, 6.2832);
    c.fill();
  }
}

function bgCloud(c){
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#9DC4DF');
  g.addColorStop(0.30, '#BBD7EB');
  g.addColorStop(0.62, '#DDEBF6');
  g.addColorStop(0.86, '#F2F7FB');
  g.addColorStop(1.00, '#FBF3E8');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  // 顶部柔光
  var sg = c.createRadialGradient(W * 0.78, -H * 0.12, 0, W * 0.78, -H * 0.12, Math.max(W, H) * 0.85);
  sg.addColorStop(0.00, 'rgba(255,250,235,0.55)');
  sg.addColorStop(0.45, 'rgba(255,250,240,0.18)');
  sg.addColorStop(1.00, 'rgba(255,250,240,0)');
  c.fillStyle = sg;
  c.fillRect(0, 0, W, H);

  var rnd = mulberry32(90210);
  var layers = [
    { y: 0.15, w: 0.20, h: 0.11, a: 0.72, count: 4 },
    { y: 0.37, w: 0.26, h: 0.14, a: 0.48, count: 3 },
    { y: 0.72, w: 0.34, h: 0.18, a: 0.24, count: 3 }
  ];

  for (var li = 0; li < layers.length; li++){
    var L = layers[li];
    for (var k = 0; k < L.count; k++){
      var cx = (k + 0.5 + (rnd() - 0.5) * 0.70) / L.count * W;
      var cy = H * L.y + (rnd() - 0.5) * H * 0.14;
      drawCloudBlob(c, cx, cy, W * L.w * (0.72 + rnd() * 0.50), H * L.h * (0.75 + rnd() * 0.50), L.a);
    }
  }

  // 地平线雾带
  var hz = c.createLinearGradient(0, H * 0.80, 0, H);
  hz.addColorStop(0.00, 'rgba(255,248,238,0)');
  hz.addColorStop(0.55, 'rgba(255,248,238,0.16)');
  hz.addColorStop(1.00, 'rgba(250,240,230,0.24)');
  c.fillStyle = hz;
  c.fillRect(0, H * 0.80, W, H * 0.20);
}

/* ================= 背景：海洋 ================= */

  g.addColorStop(0.00, '#032539');
  g.addColorStop(0.30, '#07425E');
  g.addColorStop(0.62, '#0A6685');
  g.addColorStop(0.86, '#04364C');
  g.addColorStop(1.00, '#021924');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  sg.addColorStop(0.00, 'rgba(150,225,255,0.30)');
  sg.addColorStop(0.45, 'rgba(100,190,235,0.10)');
  sg.addColorStop(1.00, 'rgba(60,150,200,0)');
  c.fillStyle = sg;
  c.fillRect(0, 0, W, H);

  // 光柱（柔化边缘）
  c.save();
  c.globalCompositeOperation = 'lighter';
  if (typeof c.filter === 'string') c.filter = 'blur(' + (Math.min(W, H) * 0.035).toFixed(1) + 'px)';
  var shafts = [
    [0.06, 0.22, 0.055],
    [0.24, 0.35, 0.038],
    [0.42, 0.51, 0.068],
    [0.60, 0.72, 0.034],
    [0.76, 0.86, 0.050],
    [0.88, 1.02, 0.028]
  ];
  for (var i = 0; i < shafts.length; i++){
    var s = shafts[i];
    var lg = c.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0.00, 'rgba(180,240,255,' + s[2] + ')');
    lg.addColorStop(0.42, 'rgba(140,215,248,' + (s[2] * 0.45) + ')');
    lg.addColorStop(1.00, 'rgba(90,175,220,0)');
    c.fillStyle = lg;
    c.beginPath();
    c.moveTo(W * s[0], -H * 0.08);
    c.lineTo(W * s[1], -H * 0.08);
    c.lineTo(W * s[1] + W * 0.30, H * 1.02);
    c.lineTo(W * s[0] - W * 0.14, H * 1.02);
    c.closePath();
    c.fill();
  }
  c.restore();

  // 远海水色团
  var rnd = mulberry32(31415);
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (var j = 0; j < 9; j++){
    var bx = rnd() * W;
    var by = H * (0.18 + rnd() * 0.65);
    var br = Math.min(W, H) * (0.10 + rnd() * 0.22);
    var rg = c.createRadialGradient(bx, by, 0, bx, by, br);
    rg.addColorStop(0.00, 'rgba(80,190,220,0.035)');
    rg.addColorStop(1.00, 'rgba(60,150,200,0)');
    c.fillStyle = rg;
    c.beginPath();
    c.arc(bx, by, br, 0, 6.2832);
    c.fill();
  }
  c.restore();

  // 海底暗带
  var fl = c.createLinearGradient(0, H * 0.80, 0, H);
  fl.addColorStop(0.00, 'rgba(1,12,20,0)');
  fl.addColorStop(1.00, 'rgba(1,10,17,0.85)');
  c.fillStyle = fl;
  c.fillRect(0, H * 0.80, W, H * 0.20);
}

/* ================= 背景：森林 ================= */
function drawFir(c, x, baseY, h, w, fill){
  c.fillStyle = fill;
  c.beginPath();
  for (var i = 0; i < 3; i++){
    var w2 = w * (1 - 0.26 * i);
    var topY = baseY - h * (0.55 + 0.22 * i);
    var botY = baseY - h * (0.10 + 0.22 * i);
    c.moveTo(x, topY);
    c.lineTo(x - w2 / 2, botY);
    c.lineTo(x + w2 / 2, botY);
  }
  c.fill();
  c.fillRect(x - w * 0.030, baseY - h * 0.11, w * 0.060, h * 0.11);
}

function bgForest(c){
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#123428');
  g.addColorStop(0.42, '#17422F');
  g.addColorStop(1.00, '#0B2018');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  var rg = c.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.55);
  rg.addColorStop(0.00, 'rgba(110,205,155,0.13)');
  rg.addColorStop(0.55, 'rgba(70,155,115,0.05)');
  rg.addColorStop(1.00, 'rgba(0,0,0,0)');
  c.fillStyle = rg;
  c.fillRect(0, 0, W, H);

  var rnd = mulberry32(20261025);
  var x, h;

  x = -80;
  while (x < W + 100){
    h = H * (0.17 + rnd() * 0.08);
    drawFir(c, x, H * 0.92, h, h * 0.46, 'rgba(78,142,112,0.15)');
    x += H * 0.06 + rnd() * H * 0.09;
  }
  x = -100;
  while (x < W + 120){
    h = H * (0.26 + rnd() * 0.11);
    drawFir(c, x, H * 1.00, h, h * 0.45, 'rgba(34,86,64,0.55)');
    x += H * 0.10 + rnd() * H * 0.12;
  }
  x = -140;
  while (x < W + 160){
    h = H * (0.35 + rnd() * 0.15);
    drawFir(c, x, H * 1.10, h, h * 0.44, 'rgba(6,17,12,0.82)');
    x += H * 0.16 + rnd() * H * 0.18;
  }
}

/* ================= 背景合成 ================= */
function buildBackground(){
  bgc.width  = Math.max(1, Math.round(W * DPR));
  bgc.height = Math.max(1, Math.round(H * DPR));
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);

  THEME.bg(bgx);

  // ∞ 引导线
  bgx.beginPath();
  for (var i = 0; i <= N; i++){
    var p = curve[i];
    if (i === 0) bgx.moveTo(p.x, p.y); else bgx.lineTo(p.x, p.y);
  }
  bgx.closePath();
  bgx.lineCap = 'round';
  var ga = THEME.id === 'cloud' ? 0.055 : 0.05;
  bgx.strokeStyle = 'rgba(' + THEME.guideRGB + ',' + ga + ')';
  bgx.lineWidth = 14;
  bgx.stroke();
  bgx.strokeStyle = 'rgba(' + THEME.guideRGB + ',' + (ga * 2.2) + ')';
  bgx.lineWidth = 1.5;
  bgx.stroke();

  // 暗角（浅色主题用冷调，深色主题用黑）
  var vg = bgx.createRadialGradient(CX, CY, Math.min(W, H) * 0.34, CX, CY, Math.max(W, H) * 0.80);
  if (THEME.id === 'cloud'){
    vg.addColorStop(0, 'rgba(120,160,195,0)');
    vg.addColorStop(1, 'rgba(120,160,195,0.16)');
  } else {
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.52)');
  }
  bgx.fillStyle = vg;
  bgx.fillRect(0, 0, W, H);
}

/* ================= 浮尘 / 气泡 ================= */
function buildMotes(){
  var rnd = mulberry32(77);
  motes = [];
  var n = Math.round(clamp(W * H / 26000, 24, 70));
  for (var i = 0; i < n; i++){
    motes.push({
      x: rnd() * W,
      y: rnd() * H,
      r: 0.6 + rnd() * 1.7,
      vy: THEME.moteSpeed * (0.45 + rnd() * 1.1),
      vx: (rnd() - 0.5) * 6,
      a: 0.35 + rnd() * 0.65,
      ph: rnd() * Math.PI * 2
    });
  }
}

function updateMotes(dt){
  for (var i = 0; i < motes.length; i++){
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += m.vx * dt;
    if (m.y < -14){ m.y = H + 14; m.x = Math.random() * W; }
    if (m.y > H + 14){ m.y = -14; m.x = Math.random() * W; }
    if (m.x < -14) m.x = W + 14;
    if (m.x > W + 14) m.x = -14;
  }
}

/* ================= 路径构建 ================= */
var SHAPES = {
  v8:       { f: function(t){ return [Math.sin(2*t), Math.cos(t)];     } },
  vellipse: { f: function(t){ return [Math.sin(t),   Math.cos(t)];     } },
  h8:       { f: function(t){ return [Math.cos(t),   Math.sin(2*t)];   } }
};

function buildCurve(){
  CX = W / 2;
  CY = H / 2;
  R = clamp(Math.min(W, H) * 0.032, 10, 20);

  var portrait = H > W * 1.12;
  var ax, ay;

  if (state.shape === 'h8'){
    ax = Math.min(W * 0.42, H * 0.78);
    ay = ax * 0.36;
  } else if (portrait){
    ay = Math.min(H * 0.375, H / 2 - 96);      // 长轴：上下
    ax = Math.min(W * 0.335, ay * 0.62);       // 短轴：左右
  } else {
    ax = Math.min(W * 0.40, H * 0.62);
    ay = ax * 0.62;
  }

  var fn = (SHAPES[state.shape] || SHAPES.v8).f;

  curve = new Array(N + 1);
  cum = new Float64Array(N + 1);

  var prevX = 0, prevY = 0, acc = 0;
  for (var i = 0; i <= N; i++){
    var t = i / N * Math.PI * 2;
    var uv = fn(t);
    var x = CX + ax * uv[0];
    var y = CY + ay * uv[1];
    curve[i] = { x: x, y: y };
    if (i === 0){ cum[0] = 0; }
    else { acc += Math.hypot(x - prevX, y - prevY); cum[i] = acc; }
    prevX = x; prevY = y;
  }
  TOTAL = acc || 1;

  A = ax; B = ay;

  gates = [
    { d: 0,         dx: curve[0].x,        dy: curve[0].y,        near:false, hit:false, prox:0, hitFx:0, missFx:0 },
    { d: TOTAL / 2, dx: curve[N >> 1].x,   dy: curve[N >> 1].y,   near:false, hit:false, prox:0, hitFx:0, missFx:0 }
  ];

  state.speed = TOTAL / state.pace;
}

function pointAt(d){
  d = ((d % TOTAL) + TOTAL) % TOTAL;
  var lo = 0, hi = N;
  while (hi - lo > 1){
    var mid = (lo + hi) >> 1;
    if (cum[mid] <= d) lo = mid; else hi = mid;
  }
  var seg = cum[hi] - cum[lo] || 1e-6;
  var f = (d - cum[lo]) / seg;
  var p0 = curve[lo], p1 = curve[hi];
  return {
    x: p0.x + (p1.x - p0.x) * f,
    y: p0.y + (p1.y - p0.y) * f
  };
}

/* ================= 尺寸变化 ================= */
function measure(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
}

/* ================= 光门判定 ================= */
function updateGates(dt){
  for (var i = 0; i < gates.length; i++){
    var g = gates[i];
    var d = ((state.dist - g.d) % TOTAL + TOTAL) % TOTAL;
    if (d > TOTAL / 2) d -= TOTAL;

    var absD = Math.abs(d);
    var near = absD / state.speed < NEAR_S;

    if (near && !g.near){ g.hit = false; }

    if (!near && g.near){
      if (!g.hit){ state.combo = 0; g.missFx = 1; }
      toggleDepth();                 // 每次穿过光门，切换近 / 远焦点
    }

    g.near = near;
    g.prox = near ? 1 - absD / (NEAR_S * state.speed) : 0;

    if (g.hitFx  > 0) g.hitFx  = Math.max(0, g.hitFx  - dt * 2.2);
    if (g.missFx > 0) g.missFx = Math.max(0, g.missFx - dt * 1.6);
  }
}

function toggleDepth(){
  state.depthTo = state.depthTo > 0.5 ? 0 : 1;
  state.depthLabel = 1.7;
  spawnRipple(state.ball.x, state.ball.y, THEME.gateRGB);
}

function tryHit(){
  if (state.mode !== 'playing') return;

  if (state.t - state.lastPress < 0.12) return;   // 防连点
  state.lastPress = state.t;

  var best = null, bestProx = -1;
  for (var i = 0; i < gates.length; i++){
    var g = gates[i];
    if (g.near && !g.hit && g.prox > bestProx){ best = g; bestProx = g.prox; }
  }

  if (!best){
    state.combo = 0;                              // 空按：连击清零，不扣分
    spawnRipple(state.ball.x, state.ball.y, '185,195,190');
    return;
  }

  best.hit = true;
  best.hitFx = 1;
  state.combo++;
  state.hits++;
  if (state.combo > state.bestCombo) state.bestCombo = state.combo;
  state.score += 10 + Math.min(state.combo - 1, 9) * 2;
  spawnBloom(best.dx, best.dy);
  if (navigator.vibrate){ try { navigator.vibrate(10); } catch (e){} }
}

/* ================= 粒子 ================= */
function spawnBloom(x, y){
  for (var i = 0; i < 10; i++){
    var a = i / 10 * Math.PI * 2 + Math.random() * 0.35;
    blooms.push({
      x: x, y: y, a: a,
      sp: 55 + Math.random() * 95,
      life: 1,
      r: 2 + Math.random() * 2.6,
      hot: i % 3 === 0
    });
  }
}

function spawnRipple(x, y, col){
  ripples.push({ x: x, y: y, life: 1, col: col });
}

function updateFx(dt){
  var i, p;

  for (i = blooms.length - 1; i >= 0; i--){
    p = blooms[i];
    p.x += Math.cos(p.a) * p.sp * dt;
    p.y += Math.sin(p.a) * p.sp * dt;
    p.sp *= (1 - 2.2 * dt);
    p.life -= dt * 1.15;
    if (p.life <= 0) blooms.splice(i, 1);
  }

  for (i = ripples.length - 1; i >= 0; i--){
    p = ripples[i];
    p.life -= dt * 1.9;
    if (p.life <= 0) ripples.splice(i, 1);
  }
}

/* ================= 主循环 ================= */
function update(dt){
  state.t += dt;
  hudAcc += dt;

  if (state.mode === 'playing'){
    state.roundTime += dt;
    state.remain = Math.max(0, state.remain - dt);
    state.dist += state.speed * dt;
    updateGates(dt);

    if (state.hint > 0){
      state.hint -= dt;
      if (state.hint <= 0) hintEl.classList.remove('on');
    }
    if (state.roundTime >= PLAY) nextPhase();

  } else if (state.mode === 'rest'){
    state.restLeft -= dt;
    state.remain = Math.max(0, state.remain - dt);
    restN.textContent = Math.ceil(Math.max(0, state.restLeft));
    if (state.restLeft <= 0) nextPhase();

  } else if (state.mode === 'paused'){
    // 冻结：不做任何推进

  } else {
    state.dist += (TOTAL / 22) * dt;          // idle / done：封面慢速巡航
  }

  if (state.dist > TOTAL) state.dist -= TOTAL;

  // 焦深缓动
  var k = 1 - Math.exp(-dt * 4.6);
  state.depth += (state.depthTo - state.depth) * k;
  if (state.depthLabel > 0) state.depthLabel -= dt;

  state.ball = pointAt(state.dist);
  updateTrail();
  updateFx(dt);
  updateMotes(dt);
  updateHud();
}

function updateTrail(){
  var b = state.ball;
  var lastP = trail[trail.length - 1];
  if (lastP && Math.hypot(b.x - lastP.x, b.y - lastP.y) < 2.5) return;
  trail.push({ x: b.x, y: b.y });
  if (trail.length > 80) trail.shift();
}

var hudAcc = 0;
function updateHud(){
  if (state.mode !== 'playing' && state.mode !== 'rest') return;
  if (hudAcc < 0.08) return;
  hudAcc = 0;
  elScore.textContent = state.score;
  elCombo.textContent = state.combo > 0 ? '×' + state.combo : '—';
  elTime.textContent  = fmt(state.remain);
  barFill.style.transform = 'scaleX(' + clamp(state.roundTime / PLAY, 0, 1) + ')';
}

/* ================= 渲染 ================= */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgc, 0, 0, W, H);
  drawMotes();
  drawTrail();
  drawGates();
  drawBlooms();
  drawRipples();
  drawBall();
  drawDepthLabel();
}

function drawMotes(){
  ctx.globalCompositeOperation = THEME.moteBlend;
  for (var i = 0; i < motes.length; i++){
    var m = motes[i];
    var tw = 0.55 + 0.45 * Math.sin(state.t * 1.3 + m.ph);
    ctx.globalAlpha = THEME.moteAlpha * m.a * tw;
    ctx.fillStyle = 'rgb(' + THEME.moteRGB + ')';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// 面板 / 远眺在前时，场景降为环境亮度，避免和文字抢注意力
function sceneAlpha(){
  if (state.mode === 'playing') return 1;
  if (state.mode === 'rest') return 0;      // 远眺时球完全隐去
  return 0.34;
}

function drawTrail(){
  var len = trail.length;
  if (len < 2) return;
  var sa = sceneAlpha();
  var shrink = 1 - 0.48 * state.depth;
  ctx.globalCompositeOperation = THEME.blend;
  for (var i = 0; i < len; i++){
    var f = i / len;
    var a = f * f * 0.55 * THEME.trailMul * sa;
    var s = (R * 2.2 + f * R * 3.4) * shrink;
    ctx.globalAlpha = a;
    ctx.drawImage(GLOW_TRAIL, trail[i].x - s / 2, trail[i].y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawGates(){
  var shrink = 1 - 0.32 * state.depth;
  for (var i = 0; i < gates.length; i++){
    var g = gates[i];
    var prox = g.prox || 0;
    var rr = (R * 2.4 + prox * R * 1.9) * shrink;

    ctx.globalCompositeOperation = THEME.blend;
    var gs = rr * 4.4;
    ctx.globalAlpha = (0.16 + prox * 0.55) * THEME.gateMul;
    ctx.drawImage(GATE_GLOW, g.dx - gs / 2, g.dy - gs / 2, gs, gs);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    ctx.arc(g.dx, g.dy, rr, 0, 6.2832);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(' + THEME.gateRGB + ',' + ((0.14 + prox * 0.62) * Math.min(THEME.gateMul, 1.2)) + ')';
    ctx.stroke();

    if (g.hitFx > 0){
      ctx.beginPath();
      ctx.arc(g.dx, g.dy, rr + (1 - g.hitFx) * R * 5, 0, 6.2832);
      ctx.lineWidth = 2.2 * g.hitFx;
      ctx.strokeStyle = 'rgba(255,196,130,' + (g.hitFx * 0.85) + ')';
      ctx.stroke();
    }
    if (g.missFx > 0){
      ctx.beginPath();
      ctx.arc(g.dx, g.dy, rr + (1 - g.missFx) * R * 3, 0, 6.2832);
      ctx.lineWidth = 1.6 * g.missFx;
      ctx.strokeStyle = 'rgba(210,120,110,' + (g.missFx * 0.45) + ')';
      ctx.stroke();
    }
  }
}

function drawBlooms(){
  if (!blooms.length) return;
  ctx.globalCompositeOperation = THEME.blend;
  for (var i = 0; i < blooms.length; i++){
    var p = blooms[i];
    ctx.globalAlpha = p.life * p.life * 0.85;
    ctx.fillStyle = p.hot ? THEME.bloomHot : THEME.bloom;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.9), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawRipples(){
  if (!ripples.length) return;
  for (var i = 0; i < ripples.length; i++){
    var p = ripples[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, R * 1.5 + (1 - p.life) * R * 6, 0, 6.2832);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(' + p.col + ',' + (p.life * 0.30) + ')';
    ctx.stroke();
  }
}

function drawBall(){
  var b = state.ball;
  var depth = state.depth;
  var sa = sceneAlpha();
  var r = R * (1 - 0.55 * depth);
  var breathe = 0.5 + 0.5 * Math.sin(state.t * 2.1);
  var gs = R * 11 * (0.93 + breathe * 0.13);

  // 浅色主题：柔和暖影，把球从天空里托出来
  if (THEME.shadowMul > 0){
    var ss = gs * 1.25;
    ctx.globalAlpha = THEME.shadowMul * (0.65 + breathe * 0.35) * (1 - 0.30 * depth) * sa;
    ctx.drawImage(SHADOW_BALL, b.x - ss / 2, b.y - ss / 2, ss, ss);
    ctx.globalAlpha = 1;
  }

  // 深色主题：加色光晕
  if (THEME.ballGlowMul > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.95 * THEME.ballGlowMul * (1 - 0.45 * depth) * sa;
    ctx.drawImage(GLOW_BALL, b.x - gs / 2, b.y - gs / 2, gs, gs);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var cg = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.35, 0, b.x, b.y, r);
  cg.addColorStop(0.00, '#FFF6EA');
  cg.addColorStop(0.55, '#FF8E62');
  cg.addColorStop(1.00, '#E8453C');
  ctx.globalAlpha = sa;
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(b.x, b.y, r, 0, 6.2832);
  ctx.fill();

  if (THEME.rim > 0){
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, 6.2832);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,' + (THEME.rim * (1 - 0.4 * depth)) + ')';
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawDepthLabel(){
  if (state.depthLabel <= 0) return;
  var b = state.ball;
  var r = R * (1 - 0.55 * state.depth);
  var a = Math.min(1, state.depthLabel / 0.55) * 0.62;
  var txt = state.depthTo > 0.5 ? '远' : '近';

  ctx.font = '600 12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(' + THEME.inkRGB + ',' + a + ')';
  ctx.fillText(txt, b.x, b.y + r + 22);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ================= 主题切换 ================= */
function applyTheme(id){
  if (!THEMES[id]) id = 'cloud';
  THEME = THEMES[id];
  document.body.dataset.theme = id;
  var pageBg = getComputedStyle(document.body).getPropertyValue('--page-bg');
  document.documentElement.style.background = (pageBg || '#08150E').trim();

  buildThemeSprites();
  if (curve.length) buildBackground();
  buildMotes();

  var seg = document.getElementById('theme');
  var kids = seg.children;
  for (var i = 0; i < kids.length; i++){
    kids[i].classList.toggle('on', kids[i].getAttribute('data-theme-id') === id);
  }
  saveStr(STORE_THEME, id);
}

/* ================= 流程 ================= */
function resetSession(){
  state.round = 0;
  state.roundTime = 0;
  state.restLeft = 0;
  state.remain = ROUNDS * PLAY + (ROUNDS - 1) * REST;
  state.score = 0; state.combo = 0; state.bestCombo = 0; state.hits = 0;
  state.speed = TOTAL / state.pace;
  state.dist = TOTAL * 0.25;
  state.hint = 0;
  state.lastPress = -99;
  state.depth = 0;
  state.depthTo = 0;
  state.depthLabel = 0;

  trail.length = 0;
  blooms.length = 0;
  ripples.length = 0;

  for (var i = 0; i < gates.length; i++){
    var g = gates[i];
    g.near = false; g.hit = false; g.prox = 0; g.hitFx = 0; g.missFx = 0;
  }

  barFill.style.transform = 'scaleX(0)';
  elScore.textContent = '0';
  elCombo.textContent = '—';
  elTime.textContent = fmt(state.remain);
}

function startGame(){
  startEl.classList.remove('show');
  resultEl.classList.remove('show');
  restEl.classList.remove('show');
  pauseEl.classList.remove('show');

  resetSession();
  state.mode = 'playing';
  state.hint = 3.6;

  hintEl.textContent = '眼睛跟着红果 · 头部不动';
  hintEl.classList.add('on');

  document.body.classList.add('playing');
  startLoop();
}

function pauseGame(){
  if (state.mode !== 'playing' && state.mode !== 'rest') return;
  state.pauseFrom = state.mode;
  state.mode = 'paused';
  restEl.classList.remove('show');
  pauseEl.classList.add('show');
  hintEl.classList.remove('on');
  document.body.classList.remove('playing');
  stopLoop();
}

function resumeGame(){
  if (state.mode !== 'paused') return;
  state.mode = state.pauseFrom;
  pauseEl.classList.remove('show');
  if (state.pauseFrom === 'rest') restEl.classList.add('show');
  document.body.classList.add('playing');
  startLoop();
}

function quitToHome(){
  state.mode = 'idle';
  pauseEl.classList.remove('show');
  resultEl.classList.remove('show');
  restEl.classList.remove('show');
  document.body.classList.remove('playing');
  hintEl.classList.remove('on');

  resetSession();
  startEl.classList.add('show');
  startLoop();
}

function nextPhase(){
  if (state.mode === 'playing'){
    if (state.round >= ROUNDS - 1){ finish(); return; }
    state.mode = 'rest';
    state.roundTime = PLAY;
    state.restLeft = REST;
    restN.textContent = String(REST);
    restEl.classList.add('show');
    trail.length = 0;
  } else if (state.mode === 'rest'){
    state.mode = 'playing';
    state.round++;
    state.roundTime = 0;
    restEl.classList.remove('show');
    hintEl.textContent = '眼睛跟着红果 · 头部不动';
    hintEl.classList.add('on');
    state.hint = 2.4;
  }
}

function finish(){
  state.mode = 'done';
  restEl.classList.remove('show');
  document.body.classList.remove('playing');
  hintEl.classList.remove('on');

  var best = loadBest();
  if (state.score > best){ best = state.score; saveBest(best); }

  rHits.textContent  = String(state.hits);
  rCombo.textContent = String(state.bestCombo);
  rScore.textContent = String(state.score);
  rBest.textContent  = String(best);

  resultEl.classList.add('show');
}

/* ================= 存档 ================= */
function loadBest(){
  try {
    var v = localStorage.getItem(STORE_BEST);
    if (!v) return 0;
    var n = parseInt(v, 10);
    if (!Number.isFinite(n) || n < 0 || n > 1e9) return 0;
    return n;
  } catch (e){ return 0; }
}

function saveBest(v){
  try { localStorage.setItem(STORE_BEST, String(v | 0)); } catch (e){}
}

function loadStr(key, allow){
  try {
    var v = localStorage.getItem(key);
    if (!v || v.length > 40) return null;
    return allow.indexOf(v) >= 0 ? v : null;
  } catch (e){ return null; }
}

function saveStr(key, v){
  try { localStorage.setItem(key, String(v)); } catch (e){}
}

/* ================= 输入 ================= */
window.addEventListener('pointerdown', function(e){
  if (state.mode !== 'playing') return;
  if (e.target && e.target.closest && e.target.closest('.panel, .rest, button')) return;
  tryHit();
});

window.addEventListener('keydown', function(e){
  var k = e.key;

  if (k === 'Escape' || k === 'Esc' || k === 'p' || k === 'P'){
    if (state.mode === 'playing' || state.mode === 'rest'){ e.preventDefault(); pauseGame(); }
    else if (state.mode === 'paused'){ e.preventDefault(); resumeGame(); }
    return;
  }

  if (e.code === 'Space' || k === ' ' || k === 'Spacebar'){
    e.preventDefault();
    if (state.mode === 'playing') tryHit();
    else if (state.mode === 'idle' || state.mode === 'done') startGame();
  }
});

document.getElementById('pace').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  state.pace = parseFloat(btn.getAttribute('data-pace')) || 12;
  state.speed = TOTAL / state.pace;
  var kids = this.children;
  for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i] === btn);
  saveStr(STORE_PACE, String(state.pace));
});

document.getElementById('theme').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  applyTheme(btn.getAttribute('data-theme-id'));
});

document.getElementById('shape').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  state.shape = btn.getAttribute('data-shape') || 'v8';
  var kids = this.children;
  for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i] === btn);
  saveStr(STORE_SHAPE, state.shape);

  buildCurve();
  buildBackground();
  trail.length = 0;
  resetSession();
  state.dist = TOTAL * 0.25;
  state.ball = pointAt(state.dist);
  render();
});

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnAgain').addEventListener('click', startGame);
document.getElementById('btnHome').addEventListener('click', quitToHome);
document.getElementById('btnPause').addEventListener('click', pauseGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnQuit').addEventListener('click', quitToHome);

/* ================= 循环控制 ================= */
var running = false, rafId = 0, lastT = 0;

function loop(now){
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
  lastT = now;
  update(dt);
  render();
}

function startLoop(){
  if (running) return;
  running = true;
  lastT = 0;
  rafId = requestAnimationFrame(loop);
}

function stopLoop(){
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}

document.addEventListener('visibilitychange', function(){
  if (document.hidden) stopLoop();
  else if (state.mode !== 'paused') startLoop();
});

var rzTimer = 0;
window.addEventListener('resize', function(){
  if (rzTimer) clearTimeout(rzTimer);
  rzTimer = setTimeout(function(){
    rzTimer = 0;
    measure();
    buildCurve();
    buildBackground();
    buildMotes();
    trail.length = 0;
    state.ball = pointAt(state.dist);
    render();                          // 暂停中也能立刻重画
  }, 140);
});

/* ================= 启动 ================= */
function boot(){
  measure();

  var savedShape = loadStr(STORE_SHAPE, ['v8', 'vellipse', 'h8']);
  state.shape = savedShape || (H > W * 1.12 ? 'v8' : 'h8');

  var sk = document.getElementById('shape').children;
  for (var j = 0; j < sk.length; j++){
    sk[j].classList.toggle('on', sk[j].getAttribute('data-shape') === state.shape);
  }

  buildCurve();

  var savedTheme = loadStr(STORE_THEME, ['cloud', 'ocean', 'forest']);
  applyTheme(savedTheme || 'cloud');

  var savedPace = loadStr(STORE_PACE, ['12', '8.5', '6']);
  if (savedPace){
    state.pace = parseFloat(savedPace);
    state.speed = TOTAL / state.pace;
    var kids = document.getElementById('pace').children;
    for (var i = 0; i < kids.length; i++){
      kids[i].classList.toggle('on', kids[i].getAttribute('data-pace') === savedPace);
    }
  }

  elTime.textContent = fmt(state.remain);
  startLoop();
}

boot();

})();
</script>
