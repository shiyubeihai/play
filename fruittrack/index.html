<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2EFE8">
<title>水果追踪</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}

:root{
  --bg:#F2EFE8;
  --bg2:#EAE5DB;
  --panel:#FFFFFF;
  --ink:#33302B;
  --ink-soft:#4A453C;
  --ink-dim:#6F6858;
  --line:#DED8CC;
  --accent:#2F6B4F;
  --accent-soft:#E6EFE9;
  --ok:#2F8A5E;
  --bad:#B54B45;
  --miss:#C08A2E;
  --tile:rgba(255,255,255,.72);
  --tileLine:rgba(200,190,172,.55);
}

body{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 55%,var(--bg2) 100%);
  background-attachment:fixed;color:var(--ink-soft);
  font:15px/1.4 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  display:flex;justify-content:center;align-items:flex-start;
  touch-action:manipulation;
}
.wrap{width:min(94vw,440px);display:flex;flex-direction:column;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
header > div:first-child{min-width:0;flex:1 1 auto}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:1.2px;color:var(--ink);white-space:nowrap}
.sub{margin:3px 0 0;font-size:10.5px;color:var(--ink-dim);letter-spacing:.3px;white-space:nowrap}

.scores{display:flex;gap:6px;flex:0 0 auto}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:5px 8px 3px;min-width:54px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 2px 6px rgba(120,100,70,.08)}
.sbox span{display:block;font-size:9px;color:var(--ink-dim);letter-spacing:.5px}
.sbox b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tr{display:flex;gap:6px;flex:0 0 auto}
.pick-n{display:flex;gap:6px;align-items:center}
.pick-n .lbl{font-size:11.5px;color:var(--ink-dim);margin-right:2px}
.nbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink-soft);
  font:600 13px/1 inherit;padding:8px 13px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s}
.nbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink-soft);
  font:600 12.5px/1 inherit;padding:9px 13px;cursor:pointer;white-space:nowrap}
.tb:active{background:#F7F4EE}

.board-wrap{position:relative;width:100%;aspect-ratio:1/1}

/* 藤编外框：两组 45° 交错条纹做编织，加高光与内影 */
.basket{
  position:absolute;inset:0;
  border-radius:30px;
  padding:11px;
  background-color:#7B9B5D;
  background-image:
    repeating-linear-gradient(45deg,
      #89AB6A 0 7px, #74954F 7px 14px),
    repeating-linear-gradient(-45deg,
      rgba(255,255,255,.20) 0 3px,
      rgba(255,255,255,0) 3px 7px,
      rgba(40,60,20,.16) 7px 10px,
      rgba(255,255,255,0) 10px 14px);
  box-shadow:
    0 10px 26px rgba(80,90,45,.22),
    inset 0 3px 0 rgba(255,255,255,.26),
    inset 0 -5px 10px rgba(45,60,22,.24);
}
#board{
  position:absolute;inset:11px;
  border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#FFFDF9,#F6F0E4);
  box-shadow:
    inset 0 0 0 1px rgba(120,105,70,.16),
    inset 0 4px 12px rgba(120,100,55,.14);
  touch-action:none;
  transition:background-color .3s ease;
}

/* 云朵：低饱和淡蓝天 + 几团柔边白云，静态 */
#board.bg-cloud{
  background-color:#E9F3FC;
  background-image:
    radial-gradient(60px 27px at 17% 20%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(46px 23px at 27% 16%, rgba(255,255,255,.90) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(72px 31px at 33% 23%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(54px 25px at 74% 61%, rgba(255,255,255,.88) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(66px 29px at 84% 56%, rgba(255,255,255,.82) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(48px 23px at 63% 70%, rgba(255,255,255,.82) 0%, rgba(255,255,255,0) 72%),
    linear-gradient(180deg,#EAF4FD 0%,#DBE9F7 100%);
}

/* 海洋：浅海蓝 + 极淡横向水纹 + 底部加深 */
#board.bg-sea{
  background-color:#DCEFF7;
  background-image:
    repeating-linear-gradient(180deg,
      rgba(255,255,255,.38) 0 1.5px,
      rgba(255,255,255,0) 1.5px 48px),
    radial-gradient(58% 38% at 20% 28%,
      rgba(255,255,255,.60) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(48% 32% at 80% 64%,
      rgba(255,255,255,.48) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(130% 65% at 50% 112%,
      rgba(110,185,215,.32) 0%, rgba(110,185,215,0) 72%),
    linear-gradient(180deg,#E7F5FB 0%,#CFE7F1 100%);
}

.fruit{
  position:absolute;left:0;top:0;
  display:flex;align-items:center;justify-content:center;
  will-change:transform;
  transition:filter .2s;
}
.fruit svg{display:block;width:100%;height:100%;overflow:visible}

/* 标记阶段：光圈 + 轻微放大 */
.fruit.target::after{
  content:"";
  position:absolute;inset:-14%;
  border-radius:50%;
  border:3px solid var(--accent);
  box-shadow:0 0 0 5px rgba(47,107,79,.14), 0 0 18px rgba(47,107,79,.35);
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.55;transform:scale(1.06)}
}

/* 选中：外圈 + 序号 */
.fruit.picked::before{
  content:"";
  position:absolute;inset:-8%;
  border-radius:50%;
  border:3px solid #3A3428;
  background:rgba(255,255,255,.14);
}
.fruit.picked .tag{
  position:absolute;top:-4%;right:-6%;
  width:20px;height:20px;border-radius:50%;
  background:#3A3428;color:#fff;
  font-size:11px;font-weight:700;line-height:20px;text-align:center;
}

/* 揭晓 */
.fruit.ok::before{
  position:absolute;inset:-8%;content:"";
  border-radius:50%;border:3px solid var(--ok);
  background:rgba(47,138,94,.12);
}
.fruit.bad::before{
  position:absolute;inset:-8%;content:"";
  border-radius:50%;border:3px solid var(--bad);
  background:rgba(181,75,69,.12);
}
.fruit.missed::before{
  position:absolute;inset:-8%;content:"";
  border-radius:50%;border:3px dashed var(--miss);
  background:rgba(192,138,46,.10);
}

.status{
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font-size:14px;color:var(--ink-dim);
  letter-spacing:.3px;
  padding:0 8px;
}
.status b{color:var(--accent);font-size:17px;margin:0 2px}
.status .ok-t{color:var(--ok);font-weight:700}
.status .bad-t{color:var(--bad);font-weight:700}

.stats{
  display:flex;justify-content:center;gap:22px;
  font-size:12px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;
}
.stats span{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>水果追踪</h1>
      <p class="sub">盯住标记 · 动完点出</p>
    </div>
    <div class="scores">
      <div class="sbox"><span>积分</span><b id="score">0</b></div>
      <div class="sbox"><span>全对</span><b id="perfect">0</b></div>
      <div class="sbox"><span>用时</span><b id="clock">0.0</b></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="pick-n">
      <span class="lbl">追踪</span>
      <button class="nbtn" data-n="1">1</button>
      <button class="nbtn on" data-n="2">2</button>
      <button class="nbtn" data-n="3">3</button>
    </div>
    <div class="tr">
      <button class="tb" id="bgBtn">背景：原木</button>
      <button class="tb" id="startBtn">开始</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="basket">
      <div id="board"></div>
    </div>
  </div>

  <div class="status" id="status">选好追踪数量，点「开始」</div>

  <div class="stats">
    <div>累计 <span id="statTotal">0</span> 局</div>
    <div>命中率 <span id="statRate">—</span></div>
  </div>

</div>

<script>
"use strict";

const $ = s => document.querySelector(s);

const KEY_TOTAL   = 'fruittrack.total';
const KEY_PERFECT = 'fruittrack.perfect';
const KEY_HIT     = 'fruittrack.hits';
const KEY_TARGET  = 'fruittrack.targets';
const KEY_N       = 'fruittrack.n';
const KEY_SCORE   = 'fruittrack.score';
const KEY_BG      = 'fruittrack.bg';

/* 计分：每命中一个 +100，全对再 +100 */
const SCORE_HIT     = 100;
const SCORE_PERFECT = 100;

/* ---------- 参数 ---------- */
const COUNT       = 10;     // 场上水果数
const MARK_MS     = 2500;   // 标记时长
const MOVE_MS     = 8000;   // 移动时长
const SIZE_RATIO  = 0.135;  // 水果直径 / 棋盘边长
const SPEED_RATIO = 0.14;   // 每秒移动距离 / 棋盘边长
const PAD         = 4;      // 贴边留白

/* ---------- 状态 ---------- */
const S = {
  phase: 'idle',      // idle | mark | move | pick | reveal
  items: [],
  targetN: 2,
  pickedCount: 0,
  hitCount: 0,
  round: 0,
  perfect: 0,
  score: 0,
  statTotal: 0,
  statHit: 0,
  statTargets: 0
};

/* 点选阶段的计时器 */
let pickStart = 0;
let tickTimer = null;

function startPickClock(){
  stopPickClock();
  pickStart = performance.now();
  clockEl.textContent = '0.0';
  tickTimer = setInterval(() => {
    clockEl.textContent = ((performance.now() - pickStart) / 1000).toFixed(1);
  }, 100);
}
function stopPickClock(){
  if (tickTimer){ clearInterval(tickTimer); tickTimer = null; }
}
function pickSeconds(){
  return pickStart ? (performance.now() - pickStart) / 1000 : 0;
}

/* 定时器与 RAF 统一管理 */
const timers = new Set();
let sessionToken = 0;
let rafId = null;
let lastT = 0;

function later(fn, ms){
  const token = sessionToken;
  const id = setTimeout(() => {
    timers.delete(id);
    if (token !== sessionToken) return;
    fn();
  }, ms);
  timers.add(id);
  return id;
}
function clearTimers(){
  timers.forEach(id => clearTimeout(id));
  timers.clear();
}
function stopRAF(){
  if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
}

/* ---------- 存储 ---------- */
function readNum(key, def){
  try {
    const v = Number(localStorage.getItem(key));
    return Number.isFinite(v) && v >= 0 ? v : def;
  } catch (e){ return def; }
}
function writeNum(key, v){
  try { localStorage.setItem(key, String(v)); } catch (e){}
}
function readStr(key, def){
  try {
    const v = localStorage.getItem(key);
    return v == null ? def : v;
  } catch (e){ return def; }
}
function writeStr(key, v){
  try { localStorage.setItem(key, String(v)); } catch (e){}
}

/* ---------- 背景 ---------- */
const BGS = ['wood', 'cloud', 'sea'];
const BG_LABEL = { wood: '原木', cloud: '云朵', sea: '海洋' };
let curBg = 'wood';

function applyBg(b){
  if (BGS.indexOf(b) < 0) b = 'wood';
  curBg = b;
  boardEl.classList.toggle('bg-cloud', b === 'cloud');
  boardEl.classList.toggle('bg-sea', b === 'sea');
  bgBtn.textContent = '背景：' + BG_LABEL[b];
}

/* ---------- 水果图形 ---------- */
const FRUITS = [
  {
    key: 'apple',
    svg:
      '<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M0,-30 q7,-16 20,-19" stroke="#5E8C3E" stroke-width="5" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="19" cy="-47" rx="11" ry="6.5" fill="#7CB356" transform="rotate(-28 19 -47)"/>'
      + '<circle r="40" fill="#D9483B"/>'
      + '<ellipse cx="0" cy="-34" rx="10" ry="7" fill="#B03A2E" opacity=".45"/>'
      + '<ellipse cx="-13" cy="-15" rx="13" ry="8.5" fill="#FFFFFF" opacity=".22" transform="rotate(-32 -13 -15)"/>'
      + '</svg>'
  },
  {
    key: 'lemon',
    svg:
      '<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M-38,0 C-38,-22 -17,-31 0,-31 C17,-31 38,-22 38,0 C38,22 17,31 0,31 C-17,31 -38,22 -38,0 Z" fill="#E8C33A"/>'
      + '<circle cx="-39" cy="0" r="6" fill="#E8C33A"/>'
      + '<circle cx="39" cy="0" r="6" fill="#E8C33A"/>'
      + '<ellipse cx="-11" cy="-12" rx="12" ry="7" fill="#FFFFFF" opacity=".3" transform="rotate(-28 -11 -12)"/>'
      + '</svg>'
  },
  {
    key: 'peach',
    svg:
      '<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M0,-34 q6,-14 18,-17" stroke="#5E8C3E" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="17" cy="-44" rx="9" ry="5.5" fill="#7CB356" transform="rotate(-30 17 -44)"/>'
      + '<circle r="38" fill="#EF8F9E"/>'
      + '<path d="M0,-35 C-11,-8 -11,16 0,34" stroke="#C9606F" stroke-width="3.2" fill="none" opacity=".55"/>'
      + '<ellipse cx="-13" cy="-13" rx="12" ry="8" fill="#FFFFFF" opacity=".26" transform="rotate(-32 -13 -13)"/>'
      + '</svg>'
  },
  {
    key: 'orange',
    svg:
      '<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<circle r="40" fill="#F9A21E"/>'
      + '<circle cx="-16" cy="-10" r="2.6" fill="#D97C0E" opacity=".42"/>'
      + '<circle cx="14" cy="-16" r="2.2" fill="#D97C0E" opacity=".42"/>'
      + '<circle cx="20" cy="10" r="2.4" fill="#D97C0E" opacity=".42"/>'
      + '<circle cx="-8" cy="18" r="2.2" fill="#D97C0E" opacity=".42"/>'
      + '<circle cx="-22" cy="12" r="1.9" fill="#D97C0E" opacity=".38"/>'
      + '<path d="M0,-38 q4,-10 12,-12" stroke="#5E8C3E" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="-13" cy="-14" rx="13" ry="8" fill="#FFFFFF" opacity=".24" transform="rotate(-32 -13 -14)"/>'
      + '</svg>'
  },
  {
    key: 'grape',
    svg:
      '<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M0,-24 q5,-13 16,-17" stroke="#5E8C3E" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      + '<circle cx="-15" cy="-7" r="17" fill="#8A5BA8"/>'
      + '<circle cx="13" cy="-9" r="16" fill="#7E4F9E"/>'
      + '<circle cx="1" cy="12" r="17" fill="#9463B4"/>'
      + '<circle cx="-17" cy="17" r="13" fill="#8355A4"/>'
      + '<circle cx="17" cy="14" r="12" fill="#7A4C9A"/>'
      + '<circle cx="-11" cy="-13" r="5" fill="#FFFFFF" opacity=".26"/>'
      + '<circle cx="9" cy="8" r="4.5" fill="#FFFFFF" opacity=".22"/>'
      + '</svg>'
  }
];

/* ---------- DOM ---------- */
const boardEl  = $('#board');
const statusEl = $('#status');
const startBtn = $('#startBtn');
const bgBtn    = $('#bgBtn');
const scoreEl  = $('#score');
const clockEl  = $('#clock');
const perfectEl = $('#perfect');
const statTotalEl = $('#statTotal');
const statRateEl = $('#statRate');

/* ---------- 几何 ---------- */
let BW = 0, D = 0;

function measure(){
  BW = boardEl.clientWidth;
  D = Math.round(BW * SIZE_RATIO);
}
function minC(){ return D / 2 + PAD; }
function maxC(){ return BW - D / 2 - PAD; }

/* ---------- 局面构建 ---------- */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildItems(){
  measure();
  boardEl.innerHTML = '';
  S.items = [];
  S.pickedCount = 0;
  S.hitCount = 0;

  /* 5 种水果各 2 个：同色必有重复，逼玩家追踪而不是记颜色 */
  const types = [];
  for (let i = 0; i < COUNT; i++) types.push(i % FRUITS.length);
  shuffle(types);

  const lo = minC(), hi = maxC();
  const speedBase = BW * SPEED_RATIO;

  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'fruit';
    el.style.width = D + 'px';
    el.style.height = D + 'px';
    el.innerHTML = FRUITS[types[i]].svg;

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.display = 'none';
    el.appendChild(tag);

    boardEl.appendChild(el);

    const ang = Math.random() * Math.PI * 2;
    const spd = speedBase * (0.82 + Math.random() * 0.36);

    S.items.push({
      id: i,
      el: el,
      tag: tag,
      x: lo + Math.random() * (hi - lo),
      y: lo + Math.random() * (hi - lo),
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      isTarget: false,
      picked: false,
      mark: ''
    });
  }

  /* 分离开，避免一开局就叠在一起 */
  for (let k = 0; k < 24; k++) separate();

  paintAll();
}

/* 简单分离：只推开，不改速度，防止糊成一团 */
function separate(){
  const lo = minC(), hi = maxC();
  const need = D * 1.02;

  for (let i = 0; i < S.items.length; i++){
    for (let j = i + 1; j < S.items.length; j++){
      const a = S.items[i], b = S.items[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy);
      if (d >= need) continue;
      if (d < 0.001){ dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 1; }

      const push = (need - d) / 2;
      const nx = dx / d, ny = dy / d;

      a.x -= nx * push; a.y -= ny * push;
      b.x += nx * push; b.y += ny * push;
    }
  }

  for (const it of S.items){
    it.x = Math.min(hi, Math.max(lo, it.x));
    it.y = Math.min(hi, Math.max(lo, it.y));
  }
}

/* ---------- 渲染 ---------- */
function paintOne(it){
  it.el.style.transform = 'translate(' + (it.x - D / 2) + 'px,' + (it.y - D / 2) + 'px)';
}
function paintAll(){
  for (const it of S.items) paintOne(it);
}

function applyClasses(){
  for (const it of S.items){
    let cls = 'fruit';
    if (S.phase === 'mark' && it.isTarget) cls += ' target';
    if (it.picked && (S.phase === 'pick' || S.phase === 'reveal')) cls += ' picked';
    if (it.mark) cls += ' ' + it.mark;
    it.el.className = cls;

    if (it.picked && (S.phase === 'pick' || S.phase === 'reveal')){
      it.tag.style.display = '';
      it.tag.textContent = String(it.order || '');
    } else {
      it.tag.style.display = 'none';
    }
  }
}

/* ---------- 动画 ---------- */
function loop(t){
  if (S.phase !== 'move'){ rafId = null; return; }
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;     // 卡顿后不要瞬移

  const lo = minC(), hi = maxC();

  for (const it of S.items){
    it.x += it.vx * dt;
    it.y += it.vy * dt;

    if (it.x < lo){ it.x = lo; it.vx = Math.abs(it.vx); }
    else if (it.x > hi){ it.x = hi; it.vx = -Math.abs(it.vx); }
    if (it.y < lo){ it.y = lo; it.vy = Math.abs(it.vy); }
    else if (it.y > hi){ it.y = hi; it.vy = -Math.abs(it.vy); }
  }

  separate();
  paintAll();

  rafId = requestAnimationFrame(loop);
}

/* ---------- 回合流程 ---------- */
function setStatus(html){
  statusEl.innerHTML = html;
}

function startRound(){
  sessionToken++;
  clearTimers();
  stopRAF();

  stopPickClock();
  pickStart = 0;

  S.round++;
  clockEl.textContent = '—';
  S.phase = 'mark';
  startBtn.textContent = '重开';

  buildItems();

  /* 随机选目标 */
  const pool = shuffle(S.items.slice());
  for (let i = 0; i < S.targetN; i++) pool[i].isTarget = true;

  applyClasses();
  setStatus('盯住这 <b>' + S.targetN + '</b> 个');

  later(() => {
    S.phase = 'move';
    applyClasses();
    lastT = 0;
    setStatus('跟住它们…');
    rafId = requestAnimationFrame(loop);

    later(() => {
      stopRAF();
      S.phase = 'pick';
      applyClasses();
      startPickClock();
      setStatus('点出刚才标记的 <b>' + S.targetN + '</b> 个');
    }, MOVE_MS);
  }, MARK_MS);
}

function pick(it){
  if (S.phase !== 'pick') return;
  if (it.picked) return;

  it.picked = true;
  S.pickedCount++;
  it.order = S.pickedCount;

  applyClasses();

  if (S.pickedCount >= S.targetN){
    later(reveal, 180);
  }
}

function reveal(){
  S.phase = 'reveal';

  const used = pickSeconds();
  stopPickClock();
  clockEl.textContent = used.toFixed(1);

  for (const it of S.items){
    if (it.isTarget && it.picked) it.mark = 'ok';
    else if (it.isTarget && !it.picked) it.mark = 'missed';
    else if (!it.isTarget && it.picked) it.mark = 'bad';
    else it.mark = '';
    if (it.mark === 'ok') S.hitCount++;
  }

  applyClasses();

  /* 统计 */
  S.statTotal++;
  S.statTargets += S.targetN;
  S.statHit += S.hitCount;

  if (S.hitCount === S.targetN){
    S.perfect++;
    perfectEl.textContent = String(S.perfect);
  }

  const gained = S.hitCount * SCORE_HIT
               + (S.hitCount === S.targetN && S.targetN > 0 ? SCORE_PERFECT : 0);
  S.score += gained;
  scoreEl.textContent = String(S.score);

  writeNum(KEY_TOTAL, S.statTotal);
  writeNum(KEY_HIT, S.statHit);
  writeNum(KEY_TARGET, S.statTargets);
  writeNum(KEY_PERFECT, S.perfect);
  writeNum(KEY_N, S.targetN);
  writeNum(KEY_SCORE, S.score);

  const rate = S.statTargets ? Math.round((S.statHit / S.statTargets) * 100) : 0;
  statTotalEl.textContent = String(S.statTotal);
  statRateEl.textContent = rate + '%';

  const secs = used.toFixed(1) + 's';
  if (S.hitCount === S.targetN){
    setStatus('<span class="ok-t">全中 ' + S.hitCount + ' / ' + S.targetN + '</span> · +'
      + gained + ' 分 · 用时 ' + secs);
  } else {
    setStatus('<span class="bad-t">中了 ' + S.hitCount + ' / ' + S.targetN + '</span> · +'
      + gained + ' 分　绿圈对、红圈错、虚线漏');
  }

  startBtn.textContent = '再来一局';
}

/* ---------- 交互 ---------- */
boardEl.addEventListener('pointerdown', e => {
  if (S.phase !== 'pick') return;
  const el = e.target.closest ? e.target.closest('.fruit') : null;
  if (!el) return;
  e.preventDefault();

  const it = S.items.find(x => x.el === el);
  if (it) pick(it);
}, { passive: false });

startBtn.addEventListener('click', () => {
  if (S.phase === 'mark' || S.phase === 'move'){
    /* 中途重开：直接开新局 */
    startRound();
    return;
  }
  startRound();
});

bgBtn.addEventListener('click', () => {
  const i = BGS.indexOf(curBg);
  const next = BGS[(i + 1) % BGS.length];
  applyBg(next);
  writeStr(KEY_BG, next);
});

document.querySelectorAll('.nbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (S.phase === 'mark' || S.phase === 'move'){
      setStatus('先等这一局走完，或点「重开」');
      return;
    }
    const n = Number(btn.dataset.n);
    S.targetN = n;
    document.querySelectorAll('.nbtn').forEach(b => {
      b.classList.toggle('on', b === btn);
    });
    writeNum(KEY_N, n);
    if (S.phase === 'idle' || S.phase === 'reveal'){
      setStatus('追踪 <b>' + n + '</b> 个 · 点「' + (S.phase === 'reveal' ? '再来一局' : '开始') + '」');
    }
  });
});

window.addEventListener('resize', () => {
  if (S.phase === 'mark' || S.phase === 'move' || S.phase === 'pick'){
    measure();
    for (const it of S.items){
      it.el.style.width = D + 'px';
      it.el.style.height = D + 'px';
      const lo = minC(), hi = maxC();
      it.x = Math.min(hi, Math.max(lo, it.x));
      it.y = Math.min(hi, Math.max(lo, it.y));
    }
    paintAll();
  }
});

/* ---------- 启动 ---------- */
(function boot(){
  S.statTotal = readNum(KEY_TOTAL, 0);
  S.perfect   = readNum(KEY_PERFECT, 0);
  S.statHit   = readNum(KEY_HIT, 0);
  S.statTargets = readNum(KEY_TARGET, 0);
  S.score     = readNum(KEY_SCORE, 0);

  applyBg(readStr(KEY_BG, 'wood'));

  const savedN = readNum(KEY_N, 2);
  S.targetN = (savedN >= 1 && savedN <= 3) ? savedN : 2;
  document.querySelectorAll('.nbtn').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.n) === S.targetN);
  });

  scoreEl.textContent = String(S.score);
  clockEl.textContent = '—';
  perfectEl.textContent = String(S.perfect);
  statTotalEl.textContent = String(S.statTotal);
  statRateEl.textContent = S.statTargets
    ? Math.round((S.statHit / S.statTargets) * 100) + '%'
    : '—';

  measure();
})();
</script>
</body>
</html>
